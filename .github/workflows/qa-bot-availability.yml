name: QA Bot availability

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-bot-availability.yml'
      - 'scripts/check_streamlit.py'

permissions:
  contents: read

concurrency:
  group: qa-bot-availability
  cancel-in-progress: false

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser checker
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Wake and check QA Bot
        run: python scripts/check_streamlit.py
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-bot-status
          path: artifacts/qa-bot-status.png
          if-no-files-found: warn
          retention-days: 7
