[server]
headless = true
maxUploadSize = 20
# Model libraries use lazy imports; disable module scanning to avoid loading optional vision dependencies.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[runner]
# Suppress source watcher errors for transformers/torchvision
magicEnabled = false

[theme]
primaryColor = "#236b58"
backgroundColor = "#f5f7f2"
secondaryBackgroundColor = "#eaf0e7"
textColor = "#173c37"
font = "sans serif"
