[server]
headless = true
maxUploadSize = 20
# Poll for source updates so Streamlit Cloud picks up GitHub releases.
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[runner]
# Suppress source watcher errors for transformers/torchvision
magicEnabled = false

[theme]
primaryColor = "#236b58"
backgroundColor = "#f5f7f2"
secondaryBackgroundColor = "#eaf0e7"
textColor = "#173c37"
font = "sans serif"
